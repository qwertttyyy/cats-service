[project]
name = "backend"
version = "0.1.0"
description = "Backend API for Cats Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "channels==4.3.2",
    "channels-redis==4.3.0",
    "daphne==4.2.1",
    "django==6.0.5",
    "django-cors-headers==4.9.0",
    "djangorestframework==3.17.1",
    "djangorestframework-simplejwt==5.5.1",
    "drf-spectacular==0.29.0",
    "pillow==12.2.0",
    "pymysql==1.1.3",
    "redis==7.4.0",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "ruff>=0.15.12",
]

[tool.black]
line-length = 79
target-version = ["py312"]
exclude = '''
/(
    \.venv
  | migrations
)/
'''

[tool.ruff]
line-length = 79
target-version = "py312"
exclude = [
    ".venv",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]
